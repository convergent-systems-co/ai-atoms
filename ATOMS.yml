# ATOMS.yml — catalog manifest for ai-atoms
#
# Conforms to: https://schema-atoms.com/
# spec_version: atoms-spec/v1.1.0

spec_version: atoms-spec/v1.1.0
name: ai-atoms
version: 0.7.0
canonical_domain: ai-atoms.com
federation: convergent-systems.co
description: |
  AI runtime primitives — skills, hooks, prompts, agents, and personas for AI agents,
  Claude Code, and agentic pipelines. Skills are bounded, invocable units of AI capability
  with declared inputs, outputs, and system-prompt fragments. Hooks are event-driven runtime
  behaviors wired into AI tool infrastructure. Prompts are typed text injected into the
  context window. Personas are portable identities. Agents bind a persona to the prompts,
  skills, tools, policies, and hooks it runs with. Models are reference data about AI models
  and the providers a runtime can get them from. Policies permit, forbid, or bound; tools are
  the affordances a runtime exposes; templates are document skeletons a runtime fills.
atom_types:
  - skill
  - hook
  - prompt
  - agent
  - persona
  - model
  - policy
  - tool
  - template
composition_type: workflows
composition_dir: workflows
runtime_consumers:
  - claude-code
  - olympus
  - aish
lifecycle:
  current: draft
licensing:
  code: Apache-2.0
  data: CC-BY-4.0
steward: convergent-systems-co
infrastructure_operator: convergent-systems-co
