# One-time setup: creates Cloudflare Pages deploy hooks for downstream sites.
# Run: gh workflow run setup-deploy-hooks.yml --repo convergent-systems-co/ai-atoms
# Then add the printed URL as org secret CF_DEPLOY_HOOK_ATOMS_UMBRELLA.

name: Setup deploy hooks

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Create deploy hook for atoms-umbrella
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          RESULT=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/atoms-umbrella/deploy_hooks" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"name":"ai-atoms-trigger"}')

          python3 - "$RESULT" <<'PYEOF'
          import json, sys
          d = json.loads(sys.argv[1])
          if d.get("success"):
              hook = d["result"]
              url = hook.get("hook_url", "")
              print(f"Hook created: {url}")
              print(f"Add as org secret  CF_DEPLOY_HOOK_ATOMS_UMBRELLA = {url}")
          else:
              errs = d.get("errors", [{}])
              print(f"Failed: {errs[0].get('message')}")
          PYEOF
