# atom: pipeline-atoms/github/ci
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python3 scripts/build-exports.py
      - run: pip install pytest
      - run: python3 -m pytest atoms/hook/tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: catalog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python3 scripts/build-exports.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: web
        run: npm install
      - name: Copy catalog
        run: mkdir -p web/public/exports && cp exports/catalog.json web/public/exports/catalog.json
      - working-directory: web
        run: npm run build
